<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript - aula11</title>
    <!-- Vinculação correta com o seu arquivo style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <input type="text" id="busca" placeholder="pesquisar por titulo">
    </header>
    <main>
        <section id="tarefas">
            <h2>Tarefas <button onclick="novaTarefa()">nova tarefa</button></h2>
            <h6>Nenhuma tarefa registrada</h6>
        </section>

        <section id="overlay"></section>
        
        <div id="Criartarefa" class="modal">
            <!-- Botão X de fechar integrado perfeitamente -->
            <button type="button" class="btn-fechar" onclick="fecharModal()">x</button>
            
            <form>
                <h3>Criar Tarefa</h3>
                <label for="titulo">Titulo</label>
                <input type="text" id="titulo">
                <label for="descricao">Descrição</label>
                <textarea id="descricao"></textarea>
                <button>Criar</button>
            </form>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
